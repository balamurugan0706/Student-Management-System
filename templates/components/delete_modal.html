<!-- Delete Confirmation Modal -->
<div class="modal-overlay" id="deleteModal">
    <div class="modal-delete">
        <div class="modal-delete-header">
            <div class="modal-delete-icon">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
                </svg>
            </div>
            <div>
                <h3 class="modal-delete-title" id="modalTitle">Confirm Action</h3>
                <p class="modal-delete-subtitle">This cannot be undone</p>
            </div>
        </div>
        <div class="modal-delete-body">
            <p class="modal-delete-text" id="modalMessage">Are you sure you want to proceed with this deletion?</p>
        </div>
        <div class="modal-delete-actions">
            <button class="btn-cancel" onclick="closeDeleteModal()">Cancel Action</button>
            <button class="btn-delete" id="confirmDeleteBtn">Delete Permanently</button>
        </div>
    </div>
</div>

<script>
function openDeleteModal(deleteUrl, title, message, rowElement = null) {
    const modal = document.getElementById('deleteModal');
    const confirmBtn = document.getElementById('confirmDeleteBtn');
    const modalTitle = document.getElementById('modalTitle');
    const modalMessage = document.getElementById('modalMessage');

    if(title) modalTitle.innerText = title;
    if(message) modalMessage.innerText = message;

    confirmBtn.onclick = function() {
        // Change button text to show loading state
        var originalText = confirmBtn.innerText;
        confirmBtn.innerText = "Deleting...";
        
        // Asynchronous POST to delete
        fetch(deleteUrl, {
            method: 'POST',
            headers: { 'Content-Type': 'application/x-www-form-urlencoded' }
        })
        .then(response => {
            if(response.ok || response.redirected) {
                closeDeleteModal();
                if(rowElement) {
                    // Smoothly fade out and remove the element
                    rowElement.style.transition = 'opacity 0.3s ease';
                    rowElement.style.opacity = '0';
                    setTimeout(() => rowElement.remove(), 300);
                } else {
                    window.location.reload();
                }
            } else {
                alert("Failed to delete user.");
                confirmBtn.innerText = originalText;
            }
        }).catch(err => {
            alert("Error: " + err);
            confirmBtn.innerText = originalText;
        });
    };

    modal.classList.add('active');
}

function closeDeleteModal() {
    document.getElementById('deleteModal').classList.remove('active');
}

// Close modal on overlay click
document.getElementById('deleteModal').addEventListener('click', function(e) {
    if (e.target === this) {
        closeDeleteModal();
    }
});

// Close modal on Escape key
document.addEventListener('keydown', function(e) {
    if (e.key === 'Escape') {
        closeDeleteModal();
    }
});
</script>
